# CI/CD pipeline
name: Continuous Integration Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v3

    - name: Set up Python Environment
      uses: actions/setup-python@v4
      with:
        python-key: '3.11'

    - name: Install Runtime System Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Enforce Code Style Standardization (Black Linting Verification)
      run: |
        black --check src/ tests/

    - name: Execute Code Structure Validation with Flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Execute Automated Unit Testing suite
      run: |
        # Setup empty dummy directories required to run structural execution tracks without crashes
        mkdir -p models
        pytest tests/