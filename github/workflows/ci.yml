# CI/CD pipeline
name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/actions-setup-python@v4
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest mock
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. Remove max-complexity or adjust as needed.
        # Alternatively, enforce strict rules by removing '--exit-zero'
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run Unit Tests with pytest
      env:
        # Mocking configurations for testing environments if needed
        MLFLOW_TRACKING_URI: "http://localhost:5000"
        MODEL_NAME: "test_model"
        MODEL_STAGE: "None"
      run: |
        # Set PYTHONPATH to make sure 'src' module is discoverable by pytest
        export PYTHONPATH=$PYTHONPATH:$(pwd)
        pytest tests/