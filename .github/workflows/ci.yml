# CI/CD pipeline
name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    # This environment variable clears the Node.js deprecation warning completely
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest  # Ensure test runner is available

    # - name: Run Unit Tests
    #   run: |
    #     pytest -v

    - name: Run tests
      env:
        PYTHONPATH: src
      run: pytest -v
    
    # This step only runs if the 'Run Unit Tests' step finishes with an exit code of 0
    - name: Build Docker Image
      if: success()
      run: |
        docker build -t credit-risk-api:${{ github.sha }} .